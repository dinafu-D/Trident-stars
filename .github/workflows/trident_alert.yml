name: TRIDENT 3-Star Alert

on:
  schedule:
    # times are UTC (IST = UTC + 5:30) -> runs every 5 min, 09:15 to 15:45 IST, Mon-Fri
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0,5,10,15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market hours (1 = yes)"
        default: "0"

concurrency:
  group: trident-stars
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # remembers which groups were already sent, so you never get the same alert twice
      - name: Restore sent-alert memory
        uses: actions/cache/restore@v4
        with:
          path: state
          key: star-state-${{ github.run_id }}
          restore-keys: star-state-

      - name: Check for new 3-star groups
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPT_TELEGRAM_BOT_TOKEN: ${{ secrets.OPT_TELEGRAM_BOT_TOKEN }}
          OPT_TELEGRAM_CHAT_ID: ${{ secrets.OPT_TELEGRAM_CHAT_ID }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          ONE_INDEX: "1"          # only the index with the nearest option expiry, both bots (0 = both indexes)
          CHART_TFS: ""           # star alerts OFF (put "1h" back to turn 3-star alerts on)
          CONBOX_ALERTS: "1"      # 5m con box new box / break alerts (0 = off)
          CB_STATUS: "1"          # index con box board, edited every 5 min (0 = off)
          CB_MIN_BARS: "1"        # every con box reported (9 = old TRIDENT label rule)
          CB_MTF_1H: "1"          # 1h MTF box line (inside / broke + time) in index + option con box (0 = off)
          TREND_ALERTS: "0"       # old EMA trend alert off
          TREND_CHANGE_ALERTS: "1"  # 5m trend change: HH+HL = UP, LL+LH = DOWN (0 = off)
          CB_OVERLAP: "0"         # same-day con box overlap alert off
          H1_BOX_ALERTS: "1"      # 1h box: 5m BREAK -> 1h CONFIRMED -> RE-IN, index + options (0 = off)
          HLLH_ALERTS: "1"        # 5m: 3+ HL / LH in a row, one LL / HH in between allowed (0 = off)
          OPTION_ALERTS: "1"        # options board ATM +-2 buy side; alert on new box / U / D; replies to typed strike / eob (0 = off)
          OPT_EOB_CONFIRM: "1"      # options EOB table, ATM +-2 (5 strikes) buy side with CE/PE + IN ticks (0 = off)
          EOB_ALERTS: "1"         # 1h EOB alerts with colour: normal / dark / sweep (0 = off)
          SKIP_15M: "1"
          ALERT_2STAR: "0"        # 0 = only complete 3-star groups
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: python trident_star_alert.py

      - name: Save sent-alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: star-state-${{ github.run_id }}
