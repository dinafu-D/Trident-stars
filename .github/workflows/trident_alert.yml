name: TRIDENT alert
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 3-10 * * 1-5"      # every 5 min, 08:30-16:00 IST on weekdays (the script itself stops outside 09:15-15:45)
concurrency:
  group: trident-alert
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          FORCE: "1"
          SYMBOLS: "NIFTY"
        run: python trident_alert.py
      - name: Save state
        run: |
          git config user.name "trident-bot"
          git config user.email "trident-bot@users.noreply.github.com"
          git add state/sent_stars.json || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push)
